services:
  backend:
    build: ./backend
    container_name: ecommerce-backend
    restart: always
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=False
      - SECRET_KEY=your-secret-key-here
      - ALLOWED_HOSTS=your-domain.com,localhost,127.0.0.1
      - CORS_ALLOWED_ORIGINS=https://your-domain.com,http://localhost
    networks:
      - ecommerce-network
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: ecommerce-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - ecommerce-network
    ports:
      - "80:80"
      - "443:443"

networks:
  ecommerce-network:
    driver: bridge

volumes:
  static_volume:
  media_volume: